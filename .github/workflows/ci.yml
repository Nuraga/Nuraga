name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: detsad
          POSTGRES_PASSWORD: detsad
          POSTGRES_DB: detsad_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U detsad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://detsad:detsad@localhost:5432/detsad_crm?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @detsad/api prisma:generate

      - name: Prisma migrate deploy
        run: pnpm --filter @detsad/api exec prisma migrate deploy

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
